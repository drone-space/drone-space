services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres_drone_space
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: drone_space
    ports:
      - '5433:5432'
    volumes:
      - postgres_data_drone_space:/var/lib/postgresql/data

volumes:
  postgres_data_drone_space:
